[package]
name = "local-video-downloader"
version = "0.1.0"
description = "Local video downloader (yt-dlp + ffmpeg)"
authors = ["you"]
edition = "2021"

[lib]
name = "local_video_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
ureq = { version = "2.10", default-features = true, features = ["tls"] }
base64 = "0.22"
